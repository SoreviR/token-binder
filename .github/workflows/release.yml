name: Release
# Pushing a vX.Y.Z tag builds, tests and publishes the .vsix to GitHub Releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check that the tag matches package.json
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != package.json v$v"; exit 1; }
      - name: Extract the release notes from CHANGELOG.md
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v h="## $v" 'index($0,h)==1 {f=1; next} /^## / {f=0} f' CHANGELOG.md > release-notes.md
          grep -q '[^[:space:]]' release-notes.md || { echo "CHANGELOG.md has no section '## $v': add one before tagging."; exit 1; }
      - run: npm run package
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "./token-binder-${GITHUB_REF_NAME#v}.vsix" --title "TokenBinder ${GITHUB_REF_NAME}" --notes-file release-notes.md
