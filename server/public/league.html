<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>TokenBinder league</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --fg: #1b2530; --muted: #66727f; --line: #dde2e8; --accent: #1a6fd4; --gold: #b8860b; --win: #1c8a4b; --lose: #c0392b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14181d; --card: #1d232a; --fg: #e6eaee; --muted: #8e99a5; --line: #2c343d; --accent: #4aa3ff; --gold: #e6b84a; --win: #4cc380; --lose: #ff7b6b; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, 'Segoe UI', sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 24px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 8px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: 0; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .rank { width: 36px; color: var(--muted); font-variant-numeric: tabular-nums; }
  tr:nth-child(1) .rank { color: var(--gold); font-weight: 700; }
  .fighter { color: var(--muted); font-size: 13px; }
  .win { color: var(--win); } .lose { color: var(--lose); }
  .duel { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; }
  .duel:last-child { border-bottom: 0; }
  .when { color: var(--muted); font-size: 12px; }
  .empty { padding: 18px 12px; color: var(--muted); }
  footer { margin-top: 32px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1 id="name">TokenBinder league</h1>
  <div class="sub" id="sub">Loading…</div>
  <h2>Ranking</h2>
  <div class="panel"><table><thead><tr><th class="rank">#</th><th>Player</th><th class="num">Elo</th><th class="num">W–L</th></tr></thead><tbody id="rank"></tbody></table></div>
  <h2>Recent duels</h2>
  <div class="panel" id="duels"></div>
  <footer>Only GitHub logins and results are shown. The ranking is private to whoever has the invite code.</footer>
</main>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const text = (tag, t, cls) => { const e = document.createElement(tag); e.textContent = t; if (cls) e.className = cls; return e; };
  const code = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
  fetch('/api/v1/public/league?code=' + encodeURIComponent(code)).then(r => r.json()).then(data => {
    if (!data.ok) { $('name').textContent = 'League not found'; $('sub').textContent = 'Check the invite code in the address.'; return; }
    document.title = data.name + ' · TokenBinder';
    $('name').textContent = data.name;
    $('sub').textContent = data.members.length + ' player' + (data.members.length === 1 ? '' : 's');
    $('rank').replaceChildren(...data.members.map((m, i) => {
      const tr = document.createElement('tr');
      const who = document.createElement('td');
      who.append(text('div', m.login));
      if (m.fighter) who.append(text('div', m.fighter.name + ' · Lv. ' + m.fighter.level + (m.fighter.grade ? ' · TBGS ' + m.fighter.grade : ''), 'fighter'));
      tr.append(text('td', String(i + 1), 'rank'), who, text('td', String(m.elo), 'num'), text('td', m.wins + '–' + m.losses, 'num'));
      return tr;
    }));
    if (!data.duels.length) { $('duels').append(text('div', 'No duels yet.', 'empty')); return; }
    $('duels').replaceChildren(...data.duels.map(d => {
      const div = document.createElement('div'); div.className = 'duel';
      const line = document.createElement('span');
      const winner = text('b', d.winner, 'win');
      const loser = d.winner === d.challenger ? d.defender : d.challenger;
      line.append(winner, document.createTextNode(' beat ' + loser + ' in ' + d.rounds + ' rounds'));
      div.append(line, text('span', new Date(d.at).toLocaleString(), 'when'));
      return div;
    }));
  }).catch(() => { $('sub').textContent = 'Could not load the league.'; });
})();
</script>
</body>
</html>
